<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="AgroNova — Smart Farming Assistant">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b150e"/><stop offset=".55" stop-color="#120e09"/><stop offset="1" stop-color="#0d0b08"/>
    </linearGradient>
    <radialGradient id="sun" cx="82%" cy="18%" r="45%">
      <stop offset="0" stop-color="#f3c978" stop-opacity=".55"/><stop offset=".35" stop-color="#e8b04a" stop-opacity=".18"/><stop offset="1" stop-color="#e8b04a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stalk" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3a2c18"/><stop offset=".7" stop-color="#b98a3c"/><stop offset="1" stop-color="#f3c978"/>
    </linearGradient>
    <clipPath id="type"><rect x="72" y="214" height="40" width="0">
      <animate attributeName="width" values="0;640;640;0" keyTimes="0;.35;.85;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <g id="wheat">
      <path d="M0 0 C 2 -40, -2 -80, 0 -120" stroke="url(#stalk)" stroke-width="2.2" fill="none"/>
      <g fill="#e8b04a">
        <ellipse cx="-4" cy="-112" rx="3.2" ry="7" transform="rotate(-25 -4 -112)"/><ellipse cx="4" cy="-108" rx="3.2" ry="7" transform="rotate(25 4 -108)"/>
        <ellipse cx="-4" cy="-100" rx="3.2" ry="7" transform="rotate(-25 -4 -100)"/><ellipse cx="4" cy="-96" rx="3.2" ry="7" transform="rotate(25 4 -96)"/>
        <ellipse cx="-4" cy="-88" rx="3.2" ry="7" transform="rotate(-25 -4 -88)"/><ellipse cx="4" cy="-84" rx="3.2" ry="7" transform="rotate(25 4 -84)"/>
        <ellipse cx="0" cy="-124" rx="2.6" ry="6"/>
      </g>
    </g>
  </defs>
  <style>
    .sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4.5s ease-in-out infinite}
    @keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
    .mote{animation:drift 9s linear infinite}
    @keyframes drift{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}100%{transform:translate(70px,-150px);opacity:0}}
    .rise{animation:rise 1.6s cubic-bezier(.16,1,.3,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
    .pulse{animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.25}}
    .caret{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .sweep{animation:sweep 6s linear infinite}
    @keyframes sweep{from{transform:translateX(-400px)}to{transform:translateX(1400px)}}
  </style>

  <rect width="1200" height="380" fill="url(#sky)"/>
  <rect width="1200" height="380" fill="url(#sun)"/>
  <rect class="sweep" x="0" y="0" width="220" height="380" fill="#f3c978" opacity=".04" transform="skewX(-20)"/>

  <!-- wheat field -->
  <g opacity=".95">
    <g transform="translate(700 380)"><use href="#wheat" class="sway" style="animation-delay:-.2s"/></g>
    <g transform="translate(740 386) scale(1.15)"><use href="#wheat" class="sway" style="animation-delay:-1.1s"/></g>
    <g transform="translate(785 380) scale(.9)"><use href="#wheat" class="sway" style="animation-delay:-2s"/></g>
    <g transform="translate(830 392) scale(1.3)"><use href="#wheat" class="sway" style="animation-delay:-.7s"/></g>
    <g transform="translate(880 384) scale(1.05)"><use href="#wheat" class="sway" style="animation-delay:-3s"/></g>
    <g transform="translate(925 394) scale(1.4)"><use href="#wheat" class="sway" style="animation-delay:-1.6s"/></g>
    <g transform="translate(975 382) scale(.95)"><use href="#wheat" class="sway" style="animation-delay:-2.4s"/></g>
    <g transform="translate(1020 392) scale(1.25)"><use href="#wheat" class="sway" style="animation-delay:-.4s"/></g>
    <g transform="translate(1070 386) scale(1.1)"><use href="#wheat" class="sway" style="animation-delay:-3.5s"/></g>
    <g transform="translate(1115 396) scale(1.45)"><use href="#wheat" class="sway" style="animation-delay:-1.3s"/></g>
    <g transform="translate(1160 384) scale(1)"><use href="#wheat" class="sway" style="animation-delay:-2.8s"/></g>
  </g>
  <rect y="300" width="1200" height="80" fill="#0d0b08" opacity=".55"/>

  <!-- dust motes -->
  <g fill="#f3c978">
    <circle class="mote" cx="620" cy="330" r="2.2" style="animation-delay:0s"/>
    <circle class="mote" cx="760" cy="300" r="1.6" style="animation-delay:-2s"/>
    <circle class="mote" cx="880" cy="340" r="2.6" style="animation-delay:-4s"/>
    <circle class="mote" cx="1000" cy="310" r="1.8" style="animation-delay:-6s"/>
    <circle class="mote" cx="1100" cy="330" r="2.2" style="animation-delay:-1s"/>
    <circle class="mote" cx="560" cy="300" r="1.4" style="animation-delay:-5s"/>
    <circle class="mote" cx="940" cy="280" r="1.5" style="animation-delay:-7.5s"/>
    <circle class="mote" cx="700" cy="350" r="1.9" style="animation-delay:-3.2s"/>
  </g>

  <!-- copy -->
  <g font-family="Consolas, 'JetBrains Mono', ui-monospace, monospace" font-size="13" letter-spacing="3" fill="#a59c8a">
    <circle cx="78" cy="78" r="4.5" fill="#a9d46f" class="pulse"/>
    <text x="92" y="83">AGRONOVA · FIELD INTELLIGENCE · CRS GENERATIVE AI FA-1 + FA-2</text>
  </g>
  <g font-family="'Instrument Serif', Georgia, 'Times New Roman', serif">
    <text x="68" y="168" font-size="92" fill="#f2ead9" letter-spacing="-2">Agro<tspan fill="#f3c978" font-style="italic">Nova</tspan></text>
  </g>
  <g clip-path="url(#type)">
    <text x="72" y="244" font-family="'Instrument Serif', Georgia, serif" font-size="30" font-style="italic" fill="#e6ddca">Advice that reads the sky before it speaks.</text>
  </g>
  <rect class="caret" x="72" y="220" width="2" height="30" fill="#e8b04a">
    <animate attributeName="x" values="72;712;712;72" keyTimes="0;.35;.85;1" dur="9s" repeatCount="indefinite"/>
  </rect>
  <g font-family="Consolas, 'JetBrains Mono', monospace" font-size="12" letter-spacing="2" fill="#6f675a">
    <text x="72" y="300">GROQ · GPT-OSS-120B · WEB SEARCH · VISION · WHISPER</text>
  </g>
  <rect x="72" y="318" width="0" height="2" fill="#e8b04a">
    <animate attributeName="width" values="0;160;160" keyTimes="0;.3;1" dur="3s" fill="freeze"/>
  </rect>
</svg>
