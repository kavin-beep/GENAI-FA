<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="How AgroNova answers a question">
  <style>
    .t{font-family:'Inter Tight','Segoe UI',system-ui,sans-serif;fill:#f2ead9}
    .m{font-family:Consolas,'JetBrains Mono',ui-monospace,monospace;fill:#a59c8a;letter-spacing:1.5px}
    .h{font-family:'Instrument Serif',Georgia,serif;fill:#f2ead9}
    .card{fill:#17130e}
    .card2{fill:#211b14}
    .flow{fill:none;stroke:#e8b04a;stroke-width:2;stroke-dasharray:6 8;animation:dash 1.4s linear infinite}
    .flow.g{stroke:#a9d46f}.flow.s{stroke:#8fc3d6}.flow.c{stroke:#d4693f}
    @keyframes dash{to{stroke-dashoffset:-28}}
    .glow{animation:glow 2.4s ease-in-out infinite}
    @keyframes glow{50%{opacity:.35}}
    .pop{animation:pop .9s cubic-bezier(.16,1,.3,1) both}
    @keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .packet{animation:none}
  </style>
  <rect width="1200" height="560" rx="24" fill="#0d0b08"/>
  <text x="40" y="52" class="m" font-size="12">HOW AGRONOVA ANSWERS · ONE TURN</text>
  <text x="40" y="92" class="h" font-size="34">Screen, <tspan fill="#f3c978" font-style="italic">think, fetch,</tspan> answer.</text>

  <!-- 1. farmer input -->
  <g>
    <rect x="40" y="150" width="210" height="190" rx="18" class="card"/>
    <text x="60" y="182" class="m" font-size="11">01 · FARMER</text>
    <text x="60" y="214" class="t" font-size="16" font-weight="600">Asks anything</text>
    <text x="60" y="244" class="t" font-size="13" opacity=".75">• typed question</text>
    <text x="60" y="266" class="t" font-size="13" opacity=".75">• crop photo</text>
    <text x="60" y="288" class="t" font-size="13" opacity=".75">• voice note</text>
    <text x="60" y="310" class="t" font-size="13" opacity=".75">• pinned farm on map</text>
  </g>

  <!-- 2. guard + whisper -->
  <g>
    <rect x="300" y="150" width="200" height="88" rx="16" class="card"/>
    <text x="318" y="178" class="m" font-size="11">02 · SAFETY</text>
    <text x="318" y="204" class="t" font-size="14" font-weight="600">Llama Prompt Guard</text>
    <text x="318" y="224" class="t" font-size="12" opacity=".7">blocks jailbreaks in ~0.3 s</text>
    <rect x="300" y="252" width="200" height="88" rx="16" class="card"/>
    <text x="318" y="280" class="m" font-size="11">02 · LISTEN / SEE</text>
    <text x="318" y="306" class="t" font-size="14" font-weight="600">Whisper · Qwen Vision</text>
    <text x="318" y="326" class="t" font-size="12" opacity=".7">voice → text · photo → model</text>
  </g>

  <!-- 3. agent -->
  <g>
    <rect x="550" y="130" width="250" height="230" rx="20" fill="#211b14"/>
    <circle cx="580" cy="162" r="6" fill="#e8b04a" class="glow"/>
    <text x="596" y="167" class="m" font-size="11">03 · AGENT LOOP</text>
    <text x="572" y="206" class="h" font-size="28">gpt-oss-120b</text>
    <text x="572" y="232" class="t" font-size="13" opacity=".75">on Groq · streamed</text>
    <text x="572" y="266" class="t" font-size="13">→ reasons first (visible)</text>
    <text x="572" y="290" class="t" font-size="13">→ calls tools on its own</text>
    <text x="572" y="314" class="t" font-size="13">→ up to 5 tool rounds</text>
    <text x="572" y="338" class="t" font-size="13">→ farm profile in context</text>
  </g>

  <!-- 4. tools -->
  <g>
    <text x="860" y="140" class="m" font-size="11">04 · LIVE TOOLS</text>
    <rect x="860" y="152" width="140" height="52" rx="12" class="card"/><text x="876" y="176" class="t" font-size="13" font-weight="600">Weather</text><text x="876" y="194" class="m" font-size="9.5">OPEN-METEO</text>
    <rect x="1012" y="152" width="148" height="52" rx="12" class="card"/><text x="1028" y="176" class="t" font-size="13" font-weight="600">Soil</text><text x="1028" y="194" class="m" font-size="9.5">ISRIC SOILGRIDS</text>
    <rect x="860" y="214" width="140" height="52" rx="12" class="card"/><text x="876" y="238" class="t" font-size="13" font-weight="600">Crop calendar</text><text x="876" y="256" class="m" font-size="9.5">ICAR / FAO KB</text>
    <rect x="1012" y="214" width="148" height="52" rx="12" class="card"/><text x="1028" y="238" class="t" font-size="13" font-weight="600">Web search</text><text x="1028" y="256" class="m" font-size="9.5">MANDI · MSP · SCHEMES</text>
    <rect x="860" y="276" width="140" height="52" rx="12" class="card"/><text x="876" y="300" class="t" font-size="13" font-weight="600">Code sandbox</text><text x="876" y="318" class="m" font-size="9.5">EXACT DOSES</text>
    <rect x="1012" y="276" width="148" height="52" rx="12" class="card"/><text x="1028" y="300" class="t" font-size="13" font-weight="600">Geocoding</text><text x="1028" y="318" class="m" font-size="9.5">ANY VILLAGE</text>
  </g>

  <!-- flows -->
  <path class="flow" d="M250 245 C 275 245, 275 195, 300 195"/>
  <path class="flow s" d="M250 245 C 275 245, 275 296, 300 296"/>
  <path class="flow" d="M500 195 C 525 195, 525 230, 550 230"/>
  <path class="flow s" d="M500 296 C 525 296, 525 262, 550 262"/>
  <path class="flow g" d="M800 220 C 830 220, 830 178, 860 178"/>
  <path class="flow g" d="M800 245 C 830 245, 830 240, 860 240"/>
  <path class="flow g" d="M800 270 C 830 270, 830 302, 860 302"/>
  <circle r="5" fill="#f3c978"><animateMotion dur="2.6s" repeatCount="indefinite" path="M250 245 C 275 245, 275 195, 300 195 L 500 195 C 525 195, 525 230, 550 230 L 800 230 C 830 230, 830 240, 860 240"/></circle>

  <!-- 5. answer -->
  <path class="flow c" d="M675 360 C 675 400, 675 400, 675 420"/>
  <g>
    <rect x="40" y="420" width="1120" height="104" rx="20" class="card"/>
    <text x="64" y="452" class="m" font-size="11">05 · ANSWER, THE WAY CLAUDE WOULD</text>
    <text x="64" y="490" class="h" font-size="24">One-line answer → steps with a <tspan fill="#f3c978" font-style="italic">why</tspan> → table → safety → next step</text>
    <g font-size="11" class="m">
      <text x="64" y="510">STREAMED · THINKING PANEL · SOURCE CARDS · LISTEN (READ ALOUD) · 3 FOLLOW-UP CHIPS · 16 LANGUAGES · FEEDBACK LOGGED</text>
    </g>
  </g>
</svg>
